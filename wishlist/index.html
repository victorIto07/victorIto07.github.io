<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presentes do Vitu</title>
<link rel="icon" type="image/png" sizes="32x32" href="/planejamento-oficina/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/planejamento-oficina/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/planejamento-oficina/assets/apple-touch-icon.png">
<meta name="theme-color" content="#07080f">
<meta property="og:title" content="Presentes do Vitu">
<meta property="og:description" content="minha lista de aniversário 🎁">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#07080f; --fg:#fff; --muted:rgba(255,255,255,.45);
    --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.13);
    --accent:#6d5efc; --accent-soft:#8ea2ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Atkinson Hyperlegible Mono",ui-monospace,monospace}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:relative;width:100%;height:100dvh;max-width:560px;margin:0 auto;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  #stars{position:absolute;inset:0;pointer-events:none}
  #glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%,rgba(90,120,230,.26),transparent 60%)}

  /* ---- gate ---- */
  #gate{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:28px;
    background:var(--bg);text-align:center}
  #gate h1{font-size:22px;letter-spacing:-.02em}
  #gate p{font-size:13px;color:var(--muted);line-height:1.6;max-width:300px}
  #gate-input{width:100%;max-width:300px;padding:14px 16px;border-radius:14px;
    border:1px solid var(--line);background:var(--panel);color:var(--fg);
    font-size:16px;text-align:center;outline:none}
  #gate-input:focus{border-color:var(--accent-soft)}
  #gate-btn{width:100%;max-width:300px;padding:14px;border-radius:14px;border:none;
    background:var(--accent);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
  #gate-btn:disabled{opacity:.4;cursor:default}
  #gate-err{font-size:12px;color:#ff9d7a;min-height:16px}
  #gate.hidden{display:none}

  /* ---- app ---- */
  #app{position:absolute;inset:0;z-index:10}
  #app.hidden{display:none}
  header{position:absolute;top:0;left:0;right:0;padding:16px 18px 0;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  header h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
  header .sub{font-size:11px;color:var(--muted);margin-top:5px}
  #who{font-size:11px;color:var(--muted);background:none;border:none;
    cursor:pointer;text-decoration:underline;flex:none}
  #orb{position:absolute;top:46px;left:0;right:0;height:270px;touch-action:none}
  #card{position:absolute;left:14px;right:14px;bottom:16px;max-height:238px;
    overflow-y:auto;padding:17px;border-radius:22px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(14px);z-index:15;
    transition:opacity .17s ease,transform .17s ease}
  #card::-webkit-scrollbar{width:0}
  #tag{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft)}
  #nome{font-size:20px;font-weight:800;margin:9px 0 7px;letter-spacing:-.02em;line-height:1.15}
  #desc{font-size:12.5px;color:rgba(255,255,255,.62);line-height:1.55}
  #acts{display:flex;gap:8px;margin-top:15px}
  #acts a,#acts button{flex:1;padding:11px;border-radius:12px;border:none;
    font-size:12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
  #loja{background:rgba(255,255,255,.1);color:#fff}
  #btn{background:var(--accent);color:#fff}
  #btn.secondary{background:rgba(255,255,255,.13)}
  #btn.hidden,#loja.hidden{display:none}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:30px;text-align:center;font-size:14px;color:var(--muted);z-index:30}
  #empty.hidden{display:none}
  #toast{position:absolute;left:50%;bottom:280px;transform:translateX(-50%) translateY(8px);
    background:rgba(20,20,30,.95);border:1px solid var(--line);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:12px;z-index:70;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .oi{position:absolute;border-radius:22px;overflow:hidden;background:#1a1a24;
    will-change:transform,opacity;cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.16)}
  .oi img{width:100%;height:100%;object-fit:cover;display:block}
  .oi .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:30px;background:linear-gradient(160deg,#3a3a52,#20202e)}
  .oi.taken img,.oi.taken .ph{filter:grayscale(1) brightness(.45)}
  .oi.taken::after{content:'✓';position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-size:26px;font-weight:800;
    color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.8)}

  @media (prefers-reduced-motion:reduce){
    #card{transition:none}
    #toast{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="glow"></div>

  <div id="gate">
    <h1>Quem é você?</h1>
    <p>Só pra você conseguir desmarcar depois, de qualquer celular. Ninguém vai ver quem reservou o quê — nem eu.</p>
    <input id="gate-input" type="text" autocomplete="given-name" autocapitalize="words"
           enterkeyhint="go" placeholder="seu nome" maxlength="40">
    <div id="gate-err"></div>
    <button id="gate-btn" disabled>Entrar</button>
    <p style="font-size:11px">nome e sobrenome, se o seu for comum</p>
  </div>

  <div id="app" class="hidden">
    <header>
      <div>
        <h1>Presentes do Vitu</h1>
        <div class="sub"><span id="counter">0</span>/<span id="total">0</span> · <span id="left">0</span> ainda livres</div>
      </div>
      <div style="display:flex;gap:10px;flex:none">
        <button id="share" style="font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline">compartilhar</button>
        <button id="who">trocar nome</button>
      </div>
    </header>
    <div id="orb"></div>
    <div id="card">
      <div id="tag">Disponível</div>
      <div id="nome">—</div>
      <div id="desc">—</div>
      <div id="acts">
        <a id="loja" href="#" target="_blank" rel="noopener">Ver na loja ↗</a>
        <button id="btn">Vou dar esse!</button>
      </div>
    </div>
    <div id="empty" class="hidden">Nenhum presente na lista ainda.</div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* Cole aqui a config do seu projeto Firebase. Veja FIREBASE.md.
   Estas chaves são públicas de propósito — o que protege o banco são as
   regras de segurança, não elas. Deixe em null pra rodar sem reservas. */
window.FIREBASE_CONFIG = null;
</script>

<script src="lib.js"></script>
<script src="itens.js"></script>
<script>
(function () {
  'use strict';
  var WISH = (globalThis.WISH = { identity: null });

  var gate = document.getElementById('gate');
  var input = document.getElementById('gate-input');
  var btn = document.getElementById('gate-btn');
  var err = document.getElementById('gate-err');
  var app = document.getElementById('app');

  // starfield
  var st = document.getElementById('stars'), h = '';
  for (var i = 0; i < 48; i++) {
    h += '<div style="position:absolute;left:' + (Math.random() * 100).toFixed(1) +
         '%;top:' + (Math.random() * 100).toFixed(1) +
         '%;width:1.4px;height:1.4px;border-radius:50%;background:rgba(255,255,255,' +
         (0.15 + Math.random() * 0.5).toFixed(2) + ')"></div>';
  }
  st.innerHTML = h;

  function validate() {
    var ok = WL.normalizeName(input.value).length >= 2;
    btn.disabled = !ok;
    return ok;
  }
  input.addEventListener('input', function () { err.textContent = ''; validate(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });
  btn.addEventListener('click', enter);

  function enter() {
    var norm = WL.normalizeName(input.value);
    if (norm.length < 2) { err.textContent = 'Escreve um nome de verdade :)'; return; }
    try { localStorage.setItem('wishlist:nome', input.value); } catch (e) {}
    start(input.value, norm);
  }

  function start(raw, norm) {
    WISH.identity = { name: raw, key: WL.hashName(norm) };
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    if (typeof WISH.onReady === 'function') WISH.onReady();
  }

  document.getElementById('who').addEventListener('click', function () {
    try { localStorage.removeItem('wishlist:nome'); } catch (e) {}
    location.reload();
  });

  var saved = null;
  try { saved = localStorage.getItem('wishlist:nome'); } catch (e) {}
  /* Deferred to a macrotask on purpose. This script runs while the later
     <script> blocks are still unparsed, so calling start() synchronously
     would fire WISH.onReady before the orbit and claims modules have
     registered theirs — the returning-visitor path would silently render
     an empty page. */
  setTimeout(function () {
    if (saved && WL.normalizeName(saved).length >= 2) {
      start(saved, WL.normalizeName(saved));
    } else {
      input.focus();
    }
  }, 0);
})();
</script>

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var items = Array.isArray(window.ITENS) ? window.ITENS : [];
  var orb = document.getElementById('orb');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var GEOM = { cx: 0, cy: 132, rx: 98, ry: 44, size: 82, lift: 24 };
  var els = [], ang = 0, vel = 0, target = 0, snapping = false;
  var drag = false, lastX = 0, moved = 0, sel = -1;

  function build() {
    orb.innerHTML = '';
    els = [];
    items.forEach(function (it, i) {
      var d = document.createElement('div');
      d.className = 'oi';
      d.style.width = GEOM.size + 'px';
      d.style.height = GEOM.size + 'px';
      d.innerHTML = '<div class="ph">🎁</div>';
      if (it.img) {
        var img = document.createElement('img');
        img.alt = '';
        img.addEventListener('error', function () { img.remove(); });
        img.src = it.img;
        d.appendChild(img);
      }
      d.addEventListener('click', function () {
        if (moved > 6) return;      // it was a drag, not a tap
        goTo(i);
      });
      orb.appendChild(d);
      els.push(d);
    });
  }

  function goTo(i) {
    var step = TAU / items.length;
    var k = Math.round(ang / step), want = -i, best = want, bd = Infinity;
    for (var t = -2; t <= 2; t++) {
      var c = want + t * items.length, dd = Math.abs(c - k);
      if (dd < bd) { bd = dd; best = c; }
    }
    target = best * step;
    if (reduce) { ang = target; snapping = false; } else { snapping = true; }
    vel = 0;
  }

  orb.addEventListener('pointerdown', function (e) {
    drag = true; snapping = false; lastX = e.clientX; vel = 0; moved = 0;
    orb.setPointerCapture(e.pointerId);
  });
  orb.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - lastX;
    moved += Math.abs(dx);
    vel = dx * 0.0042; ang += vel; lastX = e.clientX;
  });
  function release() {
    if (!drag) return;
    drag = false;
    if (reduce || Math.abs(vel) < 0.004) {
      target = WL.snapTarget(ang, items.length);
      if (reduce) { ang = target; snapping = false; } else { snapping = true; }
    }
  }
  orb.addEventListener('pointerup', release);
  orb.addEventListener('pointercancel', release);

  function frame() {
    if (!drag) {
      if (snapping) {
        var d = target - ang;
        ang += d * 0.16;
        if (Math.abs(d) < 0.0004) { ang = target; snapping = false; }
      } else if (vel !== 0) {
        ang += vel; vel *= 0.93;
        if (Math.abs(vel) < 0.006) { vel = 0; target = WL.snapTarget(ang, items.length); snapping = true; }
      }
    }
    var cur = WL.selectedIndex(ang, items.length);
    if (cur !== sel) { sel = cur; if (typeof WISH.onSelect === 'function') WISH.onSelect(cur); }
    for (var i = 0; i < els.length; i++) {
      var l = WL.layout(ang, i, items.length, GEOM);
      els[i].style.transform = 'translate(' + l.x.toFixed(1) + 'px,' + l.y.toFixed(1) +
                               'px) scale(' + l.scale.toFixed(3) + ')';
      els[i].style.opacity = l.opacity.toFixed(2);
      els[i].style.zIndex = l.z;
    }
    requestAnimationFrame(frame);
  }

  function resize() { GEOM.cx = orb.clientWidth / 2; }
  window.addEventListener('resize', resize);

  var WISH = globalThis.WISH;
  WISH.orbit = {
    goTo: goTo,
    selected: function () { return sel; },
    setTaken: function (i, taken) { if (els[i]) els[i].classList.toggle('taken', !!taken); }
  };

  var prev = WISH.onReady;
  WISH.onReady = function () {
    if (typeof prev === 'function') prev();
    if (!items.length) {
      document.getElementById('empty').classList.remove('hidden');
      document.getElementById('card').style.display = 'none';
      return;
    }
    document.getElementById('total').textContent = items.length;
    resize(); build(); frame();
  };
})();
</script>

<script>
(function () {
  'use strict';
  var WISH = globalThis.WISH;
  var items = Array.isArray(window.ITENS) ? window.ITENS : [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var card = document.getElementById('card');
  var elTag = document.getElementById('tag');
  var elNome = document.getElementById('nome');
  var elDesc = document.getElementById('desc');
  var elLoja = document.getElementById('loja');
  var elBtn = document.getElementById('btn');
  var elCounter = document.getElementById('counter');
  var actionFn = null, current = -1, currentState = 'available';

  function paint(i, state) {
    var it = items[i];
    if (!it) return;
    current = i; currentState = state;
    elNome.textContent = it.nome;
    elDesc.textContent = it.desc || '';
    elCounter.textContent = i + 1;

    if (it.url) { elLoja.href = it.url; elLoja.classList.remove('hidden'); }
    else { elLoja.classList.add('hidden'); }

    if (state === 'available') {
      elTag.textContent = 'Disponível';
      elTag.style.color = 'var(--accent-soft)';
      elBtn.textContent = 'Vou dar esse!';
      elBtn.classList.remove('hidden', 'secondary');
    } else if (state === 'mine') {
      elTag.textContent = '✓ Já reservado';
      elTag.style.color = 'var(--muted)';
      elBtn.textContent = 'Foi você — desmarcar';
      elBtn.classList.remove('hidden');
      elBtn.classList.add('secondary');
    } else {
      elTag.textContent = '✓ Já reservado';
      elTag.style.color = 'var(--muted)';
      elBtn.classList.add('hidden');
    }
  }

  function render(i, state) {
    if (i === current) { paint(i, state); return; }   // in-place, no flicker
    if (reduce) { paint(i, state); card.scrollTop = 0; return; }
    card.style.opacity = '0';
    card.style.transform = 'translateY(7px)';
    setTimeout(function () {
      paint(i, state);
      card.scrollTop = 0;
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    }, 170);
  }

  elBtn.addEventListener('click', function () {
    if (actionFn) actionFn(current, currentState);
  });

  var toastEl = document.getElementById('toast'), toastT = null;
  WISH.toast = function (msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  };

  WISH.card = {
    render: render,
    onAction: function (fn) { actionFn = fn; },
    current: function () { return current; }
  };

  // Overridden by the claims module below once Firebase state is known.
  WISH.onSelect = function (i) { render(i, 'available'); };
})();
</script>

<script>
(function () {
  'use strict';
  var WISH = globalThis.WISH;
  var items = Array.isArray(window.ITENS) ? window.ITENS : [];
  var claimed = {};             // itemId -> hashedName
  var subs = [];
  var db = null, ready = false;

  var claims = {
    available: false,
    subscribe: function (fn) { subs.push(fn); fn(claimed); },
    isMine: function (id) {
      return !!(WISH.identity && claimed[id] && claimed[id] === WISH.identity.key);
    },
    claim: function (id) {
      if (!db) return Promise.reject(new Error('offline'));
      return db.ref('claims/' + id).set(WISH.identity.key);
    },
    unclaim: function (id) {
      if (!db) return Promise.reject(new Error('offline'));
      return db.ref('claims/' + id).remove();
    }
  };
  WISH.claims = claims;

  function fire() { subs.forEach(function (fn) { fn(claimed); }); }

  function connect() {
    if (!window.FIREBASE_CONFIG || !window.firebase) return degrade();
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      db = firebase.database();
    } catch (e) { return degrade(); }

    var timer = setTimeout(function () { if (!ready) degrade(); }, 3000);
    db.ref('claims').on('value', function (snap) {
      ready = true; clearTimeout(timer);
      claims.available = true;
      claimed = snap.val() || {};
      fire();
    }, function () { clearTimeout(timer); degrade(); });
  }

  function degrade() {
    claims.available = false;
    db = null;
    claimed = {};
    var sub = document.querySelector('header .sub');
    if (sub && !document.getElementById('offline')) {
      var s = document.createElement('span');
      s.id = 'offline';
      s.textContent = ' · reservas indisponíveis';
      sub.appendChild(s);
    }
    fire();
  }

  function stateOf(i) {
    var id = items[i] && items[i].id;
    if (!id || !claimed[id]) return 'available';
    return claims.isMine(id) ? 'mine' : 'taken';
  }

  function repaint() {
    var free = 0;
    for (var i = 0; i < items.length; i++) {
      var taken = !!claimed[items[i].id];
      if (!taken) free++;
      WISH.orbit.setTaken(i, taken);
    }
    document.getElementById('left').textContent = free;
    var cur = WISH.card.current();
    if (cur >= 0) WISH.card.render(cur, stateOf(cur));
  }

  WISH.onSelect = function (i) { WISH.card.render(i, stateOf(i)); };

  WISH.card.onAction(function (i, state) {
    var it = items[i];
    if (!it || !claims.available) { WISH.toast('Reservas indisponíveis agora'); return; }
    var id = it.id, undo = claimed[id];

    if (state === 'available') {
      claimed[id] = WISH.identity.key;           // optimistic
      repaint();
      claims.claim(id).catch(function () {
        if (undo === undefined) delete claimed[id]; else claimed[id] = undo;
        repaint();
        WISH.toast('Não deu pra reservar. Alguém pegou antes?');
      });
    } else if (state === 'mine') {
      delete claimed[id];                        // optimistic
      repaint();
      claims.unclaim(id).catch(function () {
        claimed[id] = undo;
        repaint();
        WISH.toast('Não deu pra desmarcar. Tenta de novo?');
      });
    }
  });

  var prev = WISH.onReady;
  WISH.onReady = function () {
    if (typeof prev === 'function') prev();
    if (!items.length) return;
    claims.subscribe(repaint);
    connect();
  };

  document.getElementById('share').addEventListener('click', function () {
    var data = { title: 'Presentes do Vitu', text: 'minha lista de aniversário 🎁', url: location.href };
    if (navigator.share) {
      navigator.share(data).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(location.href).then(function () {
        WISH.toast('Link copiado!');
      }).catch(function () { WISH.toast(location.href); });
    } else {
      WISH.toast(location.href);
    }
  });
})();
</script>
</body>
</html>
